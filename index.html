<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Face Attendance App</title>
<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #0f1115;
    color: #e8e8e8;
    margin: 0;
    padding: 0;
  }
  header {
    background: linear-gradient(90deg, #4f46e5, #7c3aed);
    padding: 18px 20px;
    text-align: center;
  }
  header h1 { margin: 0; font-size: 22px; }
  .tabs {
    display: flex;
    justify-content: center;
    gap: 8px;
    padding: 14px;
    flex-wrap: wrap;
  }
  .tab-btn {
    background: #1c1f26;
    color: #ccc;
    border: 1px solid #333;
    padding: 10px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
  }
  .tab-btn.active {
    background: #4f46e5;
    color: white;
    border-color: #4f46e5;
  }
  .container {
    max-width: 480px;
    margin: 0 auto;
    padding: 16px;
  }
  .card {
    background: #1c1f26;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 16px;
    border: 1px solid #2a2d35;
  }
  video, canvas {
    width: 100%;
    border-radius: 10px;
    background: #000;
  }
  #video-wrap { position: relative; }
  #overlay { position: absolute; top: 0; left: 0; }
  input[type=text] {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #333;
    background: #12141a;
    color: white;
    margin-bottom: 10px;
    font-size: 14px;
  }
  button.action {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: none;
    background: #4f46e5;
    color: white;
    font-size: 15px;
    cursor: pointer;
    margin-top: 6px;
  }
  button.action:hover { background: #4338ca; }
  button.secondary {
    background: #2a2d35;
  }
  .msg {
    margin-top: 12px;
    padding: 10px;
    border-radius: 8px;
    font-size: 14px;
  }
  .msg.success { background: #14532d; color: #bbf7d0; }
  .msg.error { background: #7f1d1d; color: #fecaca; }
  .msg.warn { background: #78350f; color: #fde68a; }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    margin-top: 10px;
  }
  th, td {
    border-bottom: 1px solid #2a2d35;
    padding: 8px 6px;
    text-align: left;
  }
  th { color: #a5b4fc; }
  .hidden { display: none; }
  #loading {
    text-align: center;
    padding: 40px 16px;
    color: #a5b4fc;
  }
  select, input[type=date] {
    width: 100%;
    padding: 8px;
    border-radius: 8px;
    border: 1px solid #333;
    background: #12141a;
    color: white;
    margin-bottom: 10px;
  }
</style>
</head>
<body>

<header>
  <h1>📸 Face Attendance App</h1>
</header>

<div id="loading">Models load ho rahe hain, thora intezaar karo...</div>

<div id="app" class="hidden">
  <div class="tabs">
    <button class="tab-btn active" data-tab="register">Naya Register</button>
    <button class="tab-btn" data-tab="attendance">Attendance Lagao</button>
    <button class="tab-btn" data-tab="view">Attendance Dekho</button>
  </div>

  <div class="container">

    <!-- REGISTER TAB -->
    <div id="register" class="tab-content card">
      <input type="text" id="regName" placeholder="Naam likho">
      <div id="video-wrap">
        <video id="regVideo" autoplay muted playsinline></video>
        <canvas id="regOverlay"></canvas>
      </div>
      <button class="action" id="regCaptureBtn">📷 Photo Lo aur Add Karo</button>
      <div id="regMsg"></div>
      <div id="regCount" style="margin-top:8px; font-size:13px; color:#a5b4fc;"></div>
      <button class="action secondary" id="regDoneBtn">✅ Ho Gaya, Naya Banda Shuru Karo</button>
    </div>

    <!-- ATTENDANCE TAB -->
    <div id="attendance" class="tab-content card hidden">
      <div id="liveClock" style="text-align:center; margin-bottom:12px; padding:10px; background:#12141a; border-radius:8px; font-size:14px; color:#a5b4fc;"></div>
      <div id="video-wrap2">
        <video id="attVideo" autoplay muted playsinline></video>
        <canvas id="attOverlay"></canvas>
      </div>
      <button class="action" id="attCaptureBtn">✅ Attendance Lagao</button>
      <div id="attMsg"></div>
    </div>

    <!-- VIEW TAB -->
    <div id="view" class="tab-content card hidden">
      <label>Date select karo:</label>
      <input type="date" id="viewDate">
      <div id="viewDayLabel" style="margin-bottom:12px; color:#a5b4fc; font-size:14px;"></div>
      <table id="attTable">
        <thead><tr><th>Naam</th><th>Morning</th><th>Afternoon</th></tr></thead>
        <tbody id="attTableBody"></tbody>
      </table>
      <button class="action secondary" id="downloadBtn">📥 CSV Download Karo</button>
      <button class="action secondary" id="resetBtn" style="background:#7f1d1d;">🗑️ Sara Data Delete Karo</button>
    </div>

  </div>
</div>

<script>
const MODEL_URL = 'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights';

// ---------- Time Window Settings ----------
// Morning window: 7:40 AM - 8:15 AM
const MORNING_START = 7 * 60 + 40;   // in minutes since midnight
const MORNING_END = 8 * 60 + 15;
// Afternoon window: 2:30 PM - 3:00 PM
const AFTERNOON_START = 14 * 60 + 30;
const AFTERNOON_END = 15 * 60 + 0;

const DAY_NAMES = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

function nowMinutes() {
  const d = new Date();
  return d.getHours() * 60 + d.getMinutes();
}
function formatMinutes(mins) {
  let h = Math.floor(mins / 60);
  const m = mins % 60;
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12;
  if (h === 0) h = 12;
  return `${h}:${m.toString().padStart(2, '0')} ${ampm}`;
}
function getCurrentWindow() {
  const mins = nowMinutes();
  if (mins >= MORNING_START && mins <= MORNING_END) return 'morning';
  if (mins >= AFTERNOON_START && mins <= AFTERNOON_END) return 'afternoon';
  return null;
}
function formatDateWithDay(dateObj) {
  const day = DAY_NAMES[dateObj.getDay()];
  const dateStr = dateObj.toLocaleDateString('en-GB'); // dd/mm/yyyy
  return `${day}, ${dateStr}`;
}

// ---------- Storage Helpers ----------
function getKnownFaces() {
  return JSON.parse(localStorage.getItem('knownFaces') || '[]');
}
function saveKnownFaces(data) {
  localStorage.setItem('knownFaces', JSON.stringify(data));
}
function todayKey() {
  const d = new Date();
  return d.toISOString().split('T')[0];
}
function getAttendance(dateKey) {
  return JSON.parse(localStorage.getItem('att_' + dateKey) || '[]');
}
function saveAttendance(dateKey, data) {
  localStorage.setItem('att_' + dateKey, JSON.stringify(data));
}

// ---------- Tabs ----------
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab).classList.remove('hidden');
    if (btn.dataset.tab === 'view') renderAttendanceTable();
  });
});

// ---------- Camera Setup ----------
async function setupCamera(videoEl) {
  const stream = await navigator.mediaDevices.getUserMedia({ video: {} });
  videoEl.srcObject = stream;
  return new Promise(resolve => {
    videoEl.onloadedmetadata = () => resolve(videoEl);
  });
}

let regVideo, attVideo;

async function init() {
  await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
  await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
  await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);

  regVideo = document.getElementById('regVideo');
  attVideo = document.getElementById('attVideo');

  await setupCamera(regVideo);
  await setupCamera(attVideo);

  document.getElementById('loading').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');

  document.getElementById('viewDate').value = todayKey();
  document.getElementById('viewDate').addEventListener('change', () => {
    renderAttendanceTable();
    updateViewDayLabel();
  });
  updateViewDayLabel();

  updateLiveClock();
  setInterval(updateLiveClock, 1000);
}

function updateViewDayLabel() {
  const dateStr = document.getElementById('viewDate').value || todayKey();
  const [y, m, d] = dateStr.split('-').map(Number);
  const dateObj = new Date(y, m - 1, d);
  document.getElementById('viewDayLabel').textContent = formatDateWithDay(dateObj);
}

function updateLiveClock() {
  const now = new Date();
  const dayDate = formatDateWithDay(now);
  const timeStr = now.toLocaleTimeString('en-GB');
  const window = getCurrentWindow();

  let windowMsg;
  if (window === 'morning') {
    windowMsg = `<span style="color:#86efac;">✅ Morning window chal raha hai</span>`;
  } else if (window === 'afternoon') {
    windowMsg = `<span style="color:#86efac;">✅ Afternoon window chal raha hai</span>`;
  } else {
    windowMsg = `<span style="color:#fca5a5;">⛔ Abhi attendance ka waqt nahi hai</span>`;
  }

  const el = document.getElementById('liveClock');
  if (el) {
    el.innerHTML = `${dayDate} — ${timeStr}<br>${windowMsg}<br>
    <span style="font-size:12px; color:#888;">Morning: ${formatMinutes(MORNING_START)} - ${formatMinutes(MORNING_END)} | Afternoon: ${formatMinutes(AFTERNOON_START)} - ${formatMinutes(AFTERNOON_END)}</span>`;
  }
}

function showMsg(elId, text, type) {
  const el = document.getElementById(elId);
  el.innerHTML = `<div class="msg ${type}">${text}</div>`;
}

// ---------- Register ----------
function countPhotosFor(name) {
  return getKnownFaces().filter(k => k.name === name).length;
}

function updateRegCount(name) {
  const el = document.getElementById('regCount');
  if (!name) { el.textContent = ''; return; }
  const c = countPhotosFor(name);
  el.textContent = `${name} ki ${c} photo(s) add ho chuki hain. (Kam se kam 3 photos alag angles se lena — thora left, thora right, seedha)`;
}

document.getElementById('regName').addEventListener('input', (e) => {
  updateRegCount(e.target.value.trim());
});

document.getElementById('regCaptureBtn').addEventListener('click', async () => {
  const name = document.getElementById('regName').value.trim();
  if (!name) {
    showMsg('regMsg', 'Pehle naam likho.', 'error');
    return;
  }
  showMsg('regMsg', 'Face detect ho raha hai...', 'warn');

  const detection = await faceapi.detectSingleFace(regVideo, new faceapi.TinyFaceDetectorOptions())
    .withFaceLandmarks().withFaceDescriptor();

  if (!detection) {
    showMsg('regMsg', 'Face detect nahi hua. Achi lighting mein seedha camera ki taraf dekho.', 'error');
    return;
  }

  const known = getKnownFaces();
  known.push({ name, descriptor: Array.from(detection.descriptor) });
  saveKnownFaces(known);

  const c = countPhotosFor(name);
  showMsg('regMsg', `✅ Photo add ho gayi (${c} total). Behtar accuracy ke liye 2-3 aur alag angle se photo lo, phir "Ho Gaya" dabao.`, 'success');
  updateRegCount(name);
});

document.getElementById('regDoneBtn').addEventListener('click', () => {
  document.getElementById('regName').value = '';
  document.getElementById('regCount').textContent = '';
  showMsg('regMsg', 'Naye banday ke liye naam likho.', 'warn');
});

// ---------- Mark Attendance ----------
document.getElementById('attCaptureBtn').addEventListener('click', async () => {
  const window = getCurrentWindow();
  if (!window) {
    showMsg('attMsg', `⛔ Abhi attendance ka waqt nahi hai.<br>Morning: ${formatMinutes(MORNING_START)} - ${formatMinutes(MORNING_END)}<br>Afternoon: ${formatMinutes(AFTERNOON_START)} - ${formatMinutes(AFTERNOON_END)}`, 'error');
    return;
  }

  const known = getKnownFaces();
  if (known.length === 0) {
    showMsg('attMsg', 'Abhi koi bhi register nahi hua. Pehle Register tab mein jao.', 'error');
    return;
  }

  showMsg('attMsg', 'Face detect ho raha hai...', 'warn');

  const detection = await faceapi.detectSingleFace(attVideo, new faceapi.TinyFaceDetectorOptions())
    .withFaceLandmarks().withFaceDescriptor();

  if (!detection) {
    showMsg('attMsg', 'Face detect nahi hua. Achi lighting mein dobara try karo.', 'error');
    return;
  }

  // Group all photos by name so each person is matched against ALL their saved photos
  const grouped = {};
  known.forEach(k => {
    if (!grouped[k.name]) grouped[k.name] = [];
    grouped[k.name].push(new Float32Array(k.descriptor));
  });
  const labeledDescriptors = Object.keys(grouped).map(name =>
    new faceapi.LabeledFaceDescriptors(name, grouped[name])
  );
  // Lower number = stricter match (fewer false positives). 0.42 is fairly strict.
  const faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.42);
  const bestMatch = faceMatcher.findBestMatch(detection.descriptor);

  if (bestMatch.label === 'unknown') {
    showMsg('attMsg', '❌ Ye face register nahi hai. Pehle register karo.', 'error');
    return;
  }

  const name = bestMatch.label;
  const dateKey = todayKey();
  const now = new Date().toLocaleTimeString('en-GB');
  let records = getAttendance(dateKey);
  let record = records.find(r => r.name === name);

  if (!record) {
    record = { name, morning: '', afternoon: '' };
    records.push(record);
  }

  if (window === 'morning') {
    if (record.morning) {
      showMsg('attMsg', `⚠️ ${name} ki aaj ki Morning attendance pehle hi lag chuki hai (${record.morning}).`, 'warn');
    } else {
      record.morning = now;
      saveAttendance(dateKey, records);
      showMsg('attMsg', `✅ ${name} ki Morning attendance lag gayi (${now})`, 'success');
    }
  } else if (window === 'afternoon') {
    if (record.afternoon) {
      showMsg('attMsg', `⚠️ ${name} ki aaj ki Afternoon attendance pehle hi lag chuki hai (${record.afternoon}).`, 'warn');
    } else {
      record.afternoon = now;
      saveAttendance(dateKey, records);
      showMsg('attMsg', `✅ ${name} ki Afternoon attendance lag gayi (${now})`, 'success');
    }
  }
});

// ---------- View Attendance ----------
function renderAttendanceTable() {
  const dateKey = document.getElementById('viewDate').value || todayKey();
  const records = getAttendance(dateKey);
  const tbody = document.getElementById('attTableBody');
  tbody.innerHTML = '';
  if (records.length === 0) {
    tbody.innerHTML = '<tr><td colspan="3">Is din ki koi attendance nahi hai.</td></tr>';
    return;
  }
  records.forEach(r => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${r.name}</td><td>${r.morning || '-'}</td><td>${r.afternoon || '-'}</td>`;
    tbody.appendChild(tr);
  });
}

document.getElementById('downloadBtn').addEventListener('click', () => {
  const dateKey = document.getElementById('viewDate').value || todayKey();
  const records = getAttendance(dateKey);
  let csv = 'Name,Morning,Afternoon\n';
  records.forEach(r => {
    csv += `${r.name},${r.morning || ''},${r.afternoon || ''}\n`;
  });
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `attendance_${dateKey}.csv`;
  a.click();
});

document.getElementById('resetBtn').addEventListener('click', () => {
  if (confirm('Kya aap sach mein sara data (registered faces + attendance) delete karna chahte hain?')) {
    localStorage.clear();
    location.reload();
  }
});

init();
</script>

</body>
</html>
