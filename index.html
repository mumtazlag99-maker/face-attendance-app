<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Face Attendance App</title>
<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #0f1115;
    color: #e8e8e8;
    margin: 0;
    padding: 0;
  }
  header {
    background: linear-gradient(90deg, #4f46e5, #7c3aed);
    padding: 18px 20px;
    text-align: center;
  }
  header h1 { margin: 0; font-size: 22px; }
  .tabs {
    display: flex;
    justify-content: center;
    gap: 8px;
    padding: 14px;
    flex-wrap: wrap;
  }
  .tab-btn {
    background: #1c1f26;
    color: #ccc;
    border: 1px solid #333;
    padding: 10px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
  }
  .tab-btn.active {
    background: #4f46e5;
    color: white;
    border-color: #4f46e5;
  }
  .container {
    max-width: 480px;
    margin: 0 auto;
    padding: 16px;
  }
  .card {
    background: #1c1f26;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 16px;
    border: 1px solid #2a2d35;
  }
  video, canvas {
    width: 100%;
    border-radius: 10px;
    background: #000;
  }
  #video-wrap { position: relative; }
  #overlay { position: absolute; top: 0; left: 0; }
  input[type=text] {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #333;
    background: #12141a;
    color: white;
    margin-bottom: 10px;
    font-size: 14px;
  }
  button.action {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: none;
    background: #4f46e5;
    color: white;
    font-size: 15px;
    cursor: pointer;
    margin-top: 6px;
  }
  button.action:hover { background: #4338ca; }
  button.secondary {
    background: #2a2d35;
  }
  .msg {
    margin-top: 12px;
    padding: 10px;
    border-radius: 8px;
    font-size: 14px;
  }
  .msg.success { background: #14532d; color: #bbf7d0; }
  .msg.error { background: #7f1d1d; color: #fecaca; }
  .msg.warn { background: #78350f; color: #fde68a; }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    margin-top: 10px;
  }
  th, td {
    border-bottom: 1px solid #2a2d35;
    padding: 8px 6px;
    text-align: left;
  }
  th { color: #a5b4fc; }
  .hidden { display: none; }
  #loading {
    text-align: center;
    padding: 40px 16px;
    color: #a5b4fc;
  }
  select, input[type=date] {
    width: 100%;
    padding: 8px;
    border-radius: 8px;
    border: 1px solid #333;
    background: #12141a;
    color: white;
    margin-bottom: 10px;
  }
</style>
</head>
<body>

<header>
  <h1>📸 Face Attendance App</h1>
</header>

<div id="loading">Models load ho rahe hain, thora intezaar karo...</div>

<div id="app" class="hidden">
  <div class="tabs">
    <button class="tab-btn active" data-tab="register">Naya Register</button>
    <button class="tab-btn" data-tab="attendance">Attendance Lagao</button>
    <button class="tab-btn" data-tab="view">Attendance Dekho</button>
  </div>

  <div class="container">

    <!-- REGISTER TAB -->
    <div id="register" class="tab-content card">
      <input type="text" id="regName" placeholder="Naam likho">
      <div id="video-wrap">
        <video id="regVideo" autoplay muted playsinline></video>
        <canvas id="regOverlay"></canvas>
      </div>
      <button class="action" id="regCaptureBtn">📷 Photo Lo aur Register Karo</button>
      <div id="regMsg"></div>
    </div>

    <!-- ATTENDANCE TAB -->
    <div id="attendance" class="tab-content card hidden">
      <div id="video-wrap2">
        <video id="attVideo" autoplay muted playsinline></video>
        <canvas id="attOverlay"></canvas>
      </div>
      <button class="action" id="attCaptureBtn">✅ Attendance Lagao</button>
      <div id="attMsg"></div>
    </div>

    <!-- VIEW TAB -->
    <div id="view" class="tab-content card hidden">
      <label>Date select karo:</label>
      <input type="date" id="viewDate">
      <table id="attTable">
        <thead><tr><th>Naam</th><th>Morning</th><th>Afternoon</th></tr></thead>
        <tbody id="attTableBody"></tbody>
      </table>
      <button class="action secondary" id="downloadBtn">📥 CSV Download Karo</button>
      <button class="action secondary" id="resetBtn" style="background:#7f1d1d;">🗑️ Sara Data Delete Karo</button>
    </div>

  </div>
</div>

<script>
const MODEL_URL = 'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights';

// ---------- Storage Helpers ----------
function getKnownFaces() {
  return JSON.parse(localStorage.getItem('knownFaces') || '[]');
}
function saveKnownFaces(data) {
  localStorage.setItem('knownFaces', JSON.stringify(data));
}
function todayKey() {
  const d = new Date();
  return d.toISOString().split('T')[0];
}
function getAttendance(dateKey) {
  return JSON.parse(localStorage.getItem('att_' + dateKey) || '[]');
}
function saveAttendance(dateKey, data) {
  localStorage.setItem('att_' + dateKey, JSON.stringify(data));
}

// ---------- Tabs ----------
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab).classList.remove('hidden');
    if (btn.dataset.tab === 'view') renderAttendanceTable();
  });
});

// ---------- Camera Setup ----------
async function setupCamera(videoEl) {
  const stream = await navigator.mediaDevices.getUserMedia({ video: {} });
  videoEl.srcObject = stream;
  return new Promise(resolve => {
    videoEl.onloadedmetadata = () => resolve(videoEl);
  });
}

let regVideo, attVideo;

async function init() {
  await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
  await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
  await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);

  regVideo = document.getElementById('regVideo');
  attVideo = document.getElementById('attVideo');

  await setupCamera(regVideo);
  await setupCamera(attVideo);

  document.getElementById('loading').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');

  document.getElementById('viewDate').value = todayKey();
  document.getElementById('viewDate').addEventListener('change', renderAttendanceTable);
}

function showMsg(elId, text, type) {
  const el = document.getElementById(elId);
  el.innerHTML = `<div class="msg ${type}">${text}</div>`;
}

// ---------- Register ----------
document.getElementById('regCaptureBtn').addEventListener('click', async () => {
  const name = document.getElementById('regName').value.trim();
  if (!name) {
    showMsg('regMsg', 'Pehle naam likho.', 'error');
    return;
  }
  showMsg('regMsg', 'Face detect ho raha hai...', 'warn');

  const detection = await faceapi.detectSingleFace(regVideo, new faceapi.TinyFaceDetectorOptions())
    .withFaceLandmarks().withFaceDescriptor();

  if (!detection) {
    showMsg('regMsg', 'Face detect nahi hua. Achi lighting mein seedha camera ki taraf dekho.', 'error');
    return;
  }

  const known = getKnownFaces();
  known.push({ name, descriptor: Array.from(detection.descriptor) });
  saveKnownFaces(known);

  showMsg('regMsg', `✅ ${name} successfully register ho gaya/gayi!`, 'success');
  document.getElementById('regName').value = '';
});

// ---------- Mark Attendance ----------
document.getElementById('attCaptureBtn').addEventListener('click', async () => {
  const known = getKnownFaces();
  if (known.length === 0) {
    showMsg('attMsg', 'Abhi koi bhi register nahi hua. Pehle Register tab mein jao.', 'error');
    return;
  }

  showMsg('attMsg', 'Face detect ho raha hai...', 'warn');

  const detection = await faceapi.detectSingleFace(attVideo, new faceapi.TinyFaceDetectorOptions())
    .withFaceLandmarks().withFaceDescriptor();

  if (!detection) {
    showMsg('attMsg', 'Face detect nahi hua. Achi lighting mein dobara try karo.', 'error');
    return;
  }

  const labeledDescriptors = known.map(k =>
    new faceapi.LabeledFaceDescriptors(k.name, [new Float32Array(k.descriptor)])
  );
  const faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.5);
  const bestMatch = faceMatcher.findBestMatch(detection.descriptor);

  if (bestMatch.label === 'unknown') {
    showMsg('attMsg', '❌ Ye face register nahi hai. Pehle register karo.', 'error');
    return;
  }

  const name = bestMatch.label;
  const dateKey = todayKey();
  const now = new Date().toLocaleTimeString('en-GB');
  let records = getAttendance(dateKey);
  let record = records.find(r => r.name === name);

  if (!record) {
    records.push({ name, morning: now, afternoon: '' });
    saveAttendance(dateKey, records);
    showMsg('attMsg', `✅ ${name} ki Morning attendance lag gayi (${now})`, 'success');
  } else if (!record.afternoon) {
    record.afternoon = now;
    saveAttendance(dateKey, records);
    showMsg('attMsg', `✅ ${name} ki Afternoon attendance lag gayi (${now})`, 'success');
  } else {
    showMsg('attMsg', `⚠️ ${name} ki aaj Morning aur Afternoon dono attendance pehle hi lag chuki hai.`, 'warn');
  }
});

// ---------- View Attendance ----------
function renderAttendanceTable() {
  const dateKey = document.getElementById('viewDate').value || todayKey();
  const records = getAttendance(dateKey);
  const tbody = document.getElementById('attTableBody');
  tbody.innerHTML = '';
  if (records.length === 0) {
    tbody.innerHTML = '<tr><td colspan="3">Is din ki koi attendance nahi hai.</td></tr>';
    return;
  }
  records.forEach(r => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${r.name}</td><td>${r.morning || '-'}</td><td>${r.afternoon || '-'}</td>`;
    tbody.appendChild(tr);
  });
}

document.getElementById('downloadBtn').addEventListener('click', () => {
  const dateKey = document.getElementById('viewDate').value || todayKey();
  const records = getAttendance(dateKey);
  let csv = 'Name,Morning,Afternoon\n';
  records.forEach(r => {
    csv += `${r.name},${r.morning || ''},${r.afternoon || ''}\n`;
  });
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `attendance_${dateKey}.csv`;
  a.click();
});

document.getElementById('resetBtn').addEventListener('click', () => {
  if (confirm('Kya aap sach mein sara data (registered faces + attendance) delete karna chahte hain?')) {
    localStorage.clear();
    location.reload();
  }
});

init();
</script>

</body>
</html>
